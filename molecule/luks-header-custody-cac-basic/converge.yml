---
- name: Publish and read back the ciphertext through real HTTPS
  hosts: custody-controller
  gather_facts: false
  vars:
    luks_header_custody_cac_fixture_root: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    luks_header_custody_cac_fixture_metadata: >-
      {{ lookup('ansible.builtin.file', luks_header_custody_cac_fixture_root ~ '/fixture.json') | from_json }}
    luks_header_custody_cac_enabled: true
    luks_header_custody_cac_operation: apply
    luks_header_custody_cac_allow_create: true
    luks_header_custody_cac_path: "{{ luks_header_custody_cac_fixture_root }}/header.vault.yml"
    luks_header_custody_cac_ciphertext_sha256: "{{ luks_header_custody_cac_fixture_metadata.ciphertext_sha256 }}"
    luks_header_custody_cac_subject: host01.example.test
    luks_header_custody_cac_source_machine_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    luks_header_custody_cac_luks_uuid: 11111111-2222-4333-8444-555555555555
    luks_header_custody_cac_owner: isolated-fixture-custodian
    luks_header_custody_cac_retention: isolated-fixture-lifetime
    luks_header_custody_cac_key_retrieval_reference: isolated-fixture-vault-key
    luks_header_custody_cac_vault:
      mount: fixture
      prefix: headers
      auth:
        url: >-
          {{
            (lookup('ansible.builtin.file', luks_header_custody_cac_fixture_root ~ '/endpoint.json') | from_json).url
          }}
        namespace: ""
        ca_cert: "{{ luks_header_custody_cac_fixture_root }}/ca.pem"
        timeout: 10
        auth_method: token
        token: "{{ luks_header_custody_cac_fixture_metadata.token }}"
  roles:
    - role: lit.foundational.luks_header_custody_cac
  post_tasks:
    - name: Require a full provider readback receipt
      ansible.builtin.assert:
        that:
          - luks_header_custody_cac_result.verified | bool
          - luks_header_custody_cac_result.vault.manifest_version | int == 1
          - luks_header_custody_cac_result.vault.manifest_path is match('^headers/[0-9a-f]{64}/manifest$')
          - not (luks_header_custody_cac_result.onepassword.required | bool)
        quiet: true
