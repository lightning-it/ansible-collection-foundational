---
- name: Verify disabled and wrong-provider safety boundaries
  hosts: custody-controller
  gather_facts: false
  tasks:
    - name: Verify disabled mode requires no provider credentials
      ansible.builtin.include_role:
        name: lit.foundational.luks_header_custody_cac
      vars:
        luks_header_custody_cac_enabled: false

    - name: Reject malformed source metadata before any provider connection
      lit.foundational.luks_header_custody:
        provider: hashicorp_vault
        provider_config: {}
        package: {}
        operation: apply
        allow_create: true
      register: luks_header_custody_cac_fixture_rejected
      ignore_errors: true
      no_log: true

    - name: Require fail-closed malformed-input rejection
      ansible.builtin.assert:
        that: luks_header_custody_cac_fixture_rejected is failed
        quiet: true
