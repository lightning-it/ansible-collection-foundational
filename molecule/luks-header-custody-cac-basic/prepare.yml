---
- name: Prepare a loopback-only HTTPS custody fixture
  hosts: custody-controller
  gather_facts: false
  tasks:
    - name: Start the isolated provider and prepare authenticated ciphertext
      ansible.builtin.command:
        argv:
          - python3
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/tests/fixtures/luks_header_custody.py"
          - initialize
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
      changed_when: false
      no_log: true
