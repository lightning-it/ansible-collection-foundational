---
- name: Resolve the exact source-restricted G2 protected-port rule
  ansible.builtin.set_fact:
    _root_of_trust_validate_g2_protected_port_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in root_of_trust_validate_g2_phase_rules -%}
      {%- if rule.protocol | default('') == 'tcp'
             and rule.dst_port | default('') | string
                 == root_of_trust_validate_g2_protected_port | string -%}
      {%- set ns.rules = ns.rules + [rule] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.rules }}
    cacheable: false
  changed_when: false
  no_log: true

- name: Require one exact source-restricted G2 protected-port rule
  ansible.builtin.assert:
    that:
      - _root_of_trust_validate_g2_protected_port_rules | length == 1
      - _root_of_trust_validate_g2_protected_port_rules[0].ip_version == 'ipv4'
      - _root_of_trust_validate_g2_protected_port_rules[0].action == 'accept'
      - >-
        _root_of_trust_validate_g2_protected_port_rules[0].dst_ip
        == root_of_trust_validate_target.public_ipv4
      - _root_of_trust_validate_g2_protected_port_rules[0].src_ip is defined
      - >-
        _root_of_trust_validate_g2_protected_port_rules[0].src_ip
        is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$')
      - >-
        _root_of_trust_validate_g2_protected_port_rules[0].src_ip.split('/')[0].split('.')
        | map('int') | select('gt', 255) | list | length == 0
      - _root_of_trust_validate_g2_protected_port_rules[0].src_ip != '0.0.0.0/0'
    fail_msg: >-
      Each G2 protected TCP port must have exactly one IPv4 accept rule bound
      to the selected host and a non-wildcard source CIDR.
    quiet: true
  changed_when: false
  no_log: true
