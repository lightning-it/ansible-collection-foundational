---
- name: Validate the G2 exact target, fleet, and service placement contract
  ansible.builtin.assert:
    that:
      - root_of_trust_validate_selection_scope == 'single_root_of_trust'
      - >-
        root_of_trust_validate_target.keys() | list | sort
        == ['inventory_hostname', 'public_ipv4', 'server_number']
      - root_of_trust_validate_target.inventory_hostname == inventory_hostname
      - >-
        root_of_trust_validate_target.inventory_hostname
        == root_of_trust_validate_root_host
      - root_of_trust_validate_target.server_number is integer
      - root_of_trust_validate_target.server_number | int > 0
      - >-
        root_of_trust_validate_target.public_ipv4
        is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - >-
        root_of_trust_validate_target.public_ipv4.split('.')
        | map('int') | select('gt', 255) | list | length == 0
      - >-
        root_of_trust_validate_selected_hosts
        == [root_of_trust_validate_root_host]
      - root_of_trust_validate_expected_fleet | length > 0
      - >-
        root_of_trust_validate_expected_fleet | unique | length
        == root_of_trust_validate_expected_fleet | length
      - >-
        root_of_trust_validate_expected_fleet
        | map('trim') | select('equalto', '') | list | length == 0
      - >-
        root_of_trust_validate_install_order | unique | length
        == root_of_trust_validate_install_order | length
      - >-
        root_of_trust_validate_install_order | sort
        == root_of_trust_validate_expected_fleet | sort
      - root_of_trust_validate_install_order[0] == root_of_trust_validate_root_host
      - root_of_trust_validate_prerequisite_hosts | length > 0
      - >-
        root_of_trust_validate_prerequisite_hosts | unique | length
        == root_of_trust_validate_prerequisite_hosts | length
      - >-
        root_of_trust_validate_prerequisite_hosts
        | difference(root_of_trust_validate_expected_fleet) | length == 0
      - >-
        root_of_trust_validate_install_order[
          0:root_of_trust_validate_prerequisite_hosts | length
        ] == root_of_trust_validate_prerequisite_hosts
      - >-
        root_of_trust_validate_prerequisite_hosts[0]
        == root_of_trust_validate_root_host
      - root_of_trust_validate_tang_host == root_of_trust_validate_root_host
      - root_of_trust_validate_vault_host == root_of_trust_validate_root_host
      - root_of_trust_validate_root_host in root_of_trust_validate_expected_fleet
      - root_of_trust_validate_root_host | trim | length > 0
      - root_of_trust_validate_tang_host | trim | length > 0
      - root_of_trust_validate_vault_host | trim | length > 0
      - "'0.0.0.0/0' not in root_of_trust_validate_expected_fleet"
      - "'0.0.0.0/0' not in root_of_trust_validate_install_order"
      - "'0.0.0.0/0' not in root_of_trust_validate_prerequisite_hosts"
    fail_msg: >-
      G2 requires one exact root-of-trust target, the complete unique fleet
      and install order, and that same root first, prerequisite, Tang, and Vault host.
    quiet: true
  changed_when: false
  no_log: true
  tags: always

- name: Require exact G2 firewall phase cardinalities
  ansible.builtin.assert:
    that:
      - root_of_trust_validate_bootstrap_input_rules | length == 8
      - root_of_trust_validate_hardened_input_rules | length == 10
    fail_msg: >-
      G2 requires exactly eight bootstrap and exactly ten hardened Robot input rules.
    quiet: true
  changed_when: false
  no_log: true
  tags: always

- name: Validate every G2 bootstrap Robot firewall rule
  ansible.builtin.include_tasks: g2_validate_rule.yml
  loop: "{{ root_of_trust_validate_bootstrap_input_rules }}"
  loop_control:
    loop_var: root_of_trust_validate_g2_rule
    label: "bootstrap rule"
  no_log: true
  tags: always

- name: Validate every G2 hardened Robot firewall rule
  ansible.builtin.include_tasks: g2_validate_rule.yml
  loop: "{{ root_of_trust_validate_hardened_input_rules }}"
  loop_control:
    loop_var: root_of_trust_validate_g2_rule
    label: "hardened rule"
  no_log: true
  tags: always

- name: Validate source restrictions for each G2 bootstrap management port
  ansible.builtin.include_tasks: g2_validate_protected_port.yml
  vars:
    root_of_trust_validate_g2_phase_rules: "{{ root_of_trust_validate_bootstrap_input_rules }}"
  loop: [22, 1905, 2222]
  loop_control:
    loop_var: root_of_trust_validate_g2_protected_port
    label: "bootstrap TCP/{{ root_of_trust_validate_g2_protected_port }}"
  no_log: true
  tags: always

- name: Validate source restrictions for each G2 hardened management port
  ansible.builtin.include_tasks: g2_validate_protected_port.yml
  vars:
    root_of_trust_validate_g2_phase_rules: "{{ root_of_trust_validate_hardened_input_rules }}"
  loop: [1905, 2222]
  loop_control:
    loop_var: root_of_trust_validate_g2_protected_port
    label: "hardened TCP/{{ root_of_trust_validate_g2_protected_port }}"
  no_log: true
  tags: always

- name: Resolve forbidden hardened TCP 22 and exact Tang rules
  ansible.builtin.set_fact:
    _root_of_trust_validate_g2_hardened_tcp22_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in root_of_trust_validate_hardened_input_rules -%}
      {%- if rule.protocol | default('') == 'tcp'
             and rule.dst_port | default('') | string == '22' -%}
      {%- set ns.rules = ns.rules + [rule] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.rules }}
    _root_of_trust_validate_g2_tang_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in root_of_trust_validate_hardened_input_rules -%}
      {%- if rule.protocol | default('') == 'tcp'
             and rule.dst_port | default('') | string == '80' -%}
      {%- set ns.rules = ns.rules + [rule] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.rules }}
    cacheable: false
  changed_when: false
  no_log: true
  tags: always

- name: Require no hardened TCP 22 and exactly three Tang source rules
  ansible.builtin.assert:
    that:
      - _root_of_trust_validate_g2_hardened_tcp22_rules | length == 0
      - _root_of_trust_validate_g2_tang_rules | length == 3
      - >-
        _root_of_trust_validate_g2_tang_rules
        | map(attribute='src_ip') | unique | length == 3
    fail_msg: >-
      G2 hardened policy must remove TCP 22 and contain exactly three unique Tang rules.
    quiet: true
  changed_when: false
  no_log: true
  tags: always

- name: Validate each exact Tang IPv4 source
  ansible.builtin.assert:
    that:
      - item.ip_version == 'ipv4'
      - item.protocol == 'tcp'
      - item.action == 'accept'
      - item.dst_ip == root_of_trust_validate_target.public_ipv4
      - item.dst_port | string == '80'
      - >-
        item.src_ip
        is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$')
      - >-
        item.src_ip.split('/')[0].split('.')
        | map('int') | select('gt', 255) | list | length == 0
      - item.src_ip != '0.0.0.0/0'
    fail_msg: >-
      Each of the three G2 Tang rules must be an exact unique IPv4 /32 source
      accepted on TCP 80 only for the selected root-of-trust target.
    quiet: true
  loop: "{{ _root_of_trust_validate_g2_tang_rules }}"
  loop_control:
    label: "Tang /32"
  changed_when: false
  no_log: true
  tags: always
