# yamllint disable rule:truthy
---
name: Collection CI

on:
  # CI on pushes to integration/stable branches and version tags (v*)
  push:
    branches: ["develop", "main"]
    tags: ["v*"]
  # CI on all PRs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Common tool versions (override if needed)
  PYTHON_VERSION: "3.11"
  ANSIBLE_LINT_VERSION: "6.22.2"
  TERRAFORM_VERSION: "1.15.8"
  COLLECTION_NAMESPACE: lit

  # Example playbook that MUST exist in this repository.
  EXAMPLE_PLAYBOOK: "playbooks/example.yml"
  EXAMPLE_PLAYBOOK_ARGS: ${{ github.event.repository.name == 'ansible-collection-ubuntu' && '--check' || '' }}

jobs:
  # ---------------------------------------------------------------------------
  # Collection CI
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ansible-lint via ee-wunder-devtools-ubi9)
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # 2) Run ansible-lint inside the ee-wunder-devtools-ubi9 container
      - name: Run ansible-lint via devtools-ansible-lint.sh
        env:
          # These env vars make the script generic across collections
          COLLECTION_NAMESPACE: ${{ env.COLLECTION_NAMESPACE }}
          ANSIBLE_LINT_VERSION: ${{ env.ANSIBLE_LINT_VERSION }}
        run: |
          bash scripts/devtools-ansible-lint.sh

  molecule:
    name: Molecule (via devtools)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Run Molecule via ee-wunder-devtools-ubi9.
      # scripts/devtools-molecule.sh is expected to:
      #  - build the collection
      #  - install it into a temp path
      #  - run one or more molecule scenarios
      - name: Run Molecule tests (via devtools)
        env:
          MOLECULE_NO_LOG: "false"
        run: |
          bash scripts/devtools-molecule.sh

  build-install:
    name: Build & install collection (via devtools smoke test)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Run a full collection smoke test inside ee-wunder-devtools-ubi9:
      #  - build the collection
      #  - install it into /tmp/wunder/collections
      #  - run the example playbook
      - name: Run collection smoke test via devtools-collection-smoke.sh
        env:
          COLLECTION_NAMESPACE: ${{ env.COLLECTION_NAMESPACE }}
          EXAMPLE_PLAYBOOK: ${{ env.EXAMPLE_PLAYBOOK }}
          EXAMPLE_PLAYBOOK_ARGS: ${{ env.EXAMPLE_PLAYBOOK_ARGS }}
        run: |
          bash scripts/devtools-collection-smoke.sh

  build-candidate:
    name: Build immutable Heavy candidate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and checksum exact collection candidate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "ansible-core==2.18.18"
          mkdir -p dist/candidate
          ansible-galaxy collection build --output-path dist/candidate --force
          mapfile -t candidates < <(
            find dist/candidate -maxdepth 1 -type f -name '*.tar.gz' -print
          )
          test "${#candidates[@]}" -eq 1
          (
            cd dist/candidate
            sha256sum "$(basename "${candidates[0]}")" > candidate-SHA256SUMS
            sha256sum --check candidate-SHA256SUMS
          )
      - name: Upload exact candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: foundational-candidate-${{ github.sha }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7

  heavy-cells:
    name: Heavy matrix (delegated to modulix-validation)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    needs: build-candidate
    uses: lightning-it/modulix-validation/.github/workflows/collection-molecule-profile.yml@a3e114b4b49eecfd74cd3981a323699ab3124114
    with:
      profile: heavy
      matrix-json: >-
        {"include":[
          {"runner":["self-hosted","linux","x64","incus"],
           "scenario":"hetzner-cloud-incus_heavy",
           "target":"ubuntu-24.04",
           "infrastructure":"incus",
           "image":"images:ubuntu/24.04",
           "instance_type":"container",
           "roles":["hetzner_cloud"],
           "success_marker":"assertions/hetzner-cloud-incus.passed"},
          {"runner":["self-hosted","linux","x64"],
           "scenario":"secret-resolver-vault-integration_heavy",
           "target":"vault-dev",
           "infrastructure":"local",
           "roles":["secret_resolver"],
           "success_marker":"assertions/secret-resolver-vault.passed"},
          {"runner":["self-hosted","linux","x64"],
           "scenario":"hetzner-robot-live_heavy",
           "target":"hetzner-robot-live",
           "infrastructure":"external",
           "roles":["hetzner_robot_cac"],
           "success_marker":"assertions/hetzner-robot-live.passed"},
          {"runner":["self-hosted","linux","x64"],
           "scenario":"hetzner_cloud_live_heavy",
           "target":"hetzner-cloud-live",
           "infrastructure":"external",
           "roles":["hetzner_cloud"],
           "success_marker":"assertions/hetzner-cloud-live.passed"}
        ]}
      candidate-artifact: foundational-candidate-${{ github.sha }}
      source-sha: ${{ github.sha }}
      collection-namespace: lit
      collection-name: foundational
      environment-name: ansible-collections
    secrets: inherit

  heavy:
    name: Collection / Heavy
    if: always()
    needs: [build-candidate, heavy-cells]
    runs-on: ubuntu-latest
    steps:
      - name: Require Heavy when the protected matrix is selected
        env:
          BUILD_RESULT: ${{ needs.build-candidate.result }}
          HEAVY_RESULT: ${{ needs.heavy-cells.result }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          if [ "$EVENT_NAME" = workflow_dispatch ] ||
            { [ "$EVENT_NAME" = push ] &&
              { [ "$GIT_REF" = refs/heads/develop ] ||
                [ "$GIT_REF" = refs/heads/main ]; }; }
          then
            test "$HEAVY_RESULT" = success
          else
            test "$HEAVY_RESULT" = skipped
          fi
