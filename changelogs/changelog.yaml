        namespace: ''
      - description: Plan, create, or inspect one exact 1Password SSH Key item.
        name: onepassword_ssh_key_item
        namespace: ''
      - description: Stream one pinned 1Password secret into one pinned SSH session.
        name: onepassword_ssh_secret_stdin
        namespace: ''
    release_date: '2026-09-25'
