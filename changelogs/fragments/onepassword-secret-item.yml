---
minor_changes:
  - >-
    Add the controller-only ``onepassword_secret_item`` action for 1Password-internal generation and immutable item
    ID/version validation without ever reading or returning the generated Password value.
  - >-
    Add ``onepassword_ssh_key_item`` for fail-closed Ed25519 creation, immutable ID/version/fingerprint validation,
    and an exact-Agent signing challenge while making private-key export structurally unavailable.
  - >-
    Add ``onepassword_ssh_secret_stdin`` to validate exact Password and SSH Key item identities, require an externally
    pinned version for each item, a pinned fingerprint, and a protected SSH Agent socket, and submit the secret to one
    explicit
    non-interactive ``/bin/cryptroot-unlock`` SSH command without exposing it to Ansible variables, facts, logs,
    process arguments, environment variables, or plaintext files.
security_fixes:
  - >-
    Validate 1Password account and user UUIDs using their real uppercase 26-character CLI representation while
    retaining the lowercase contract for vault and item IDs. This prevents valid desktop identities from being
    rejected or incorrectly treated as vault/item identifiers.
  - >-
    Bind controller executables to complete SHA-256 digests and safe owner, mode, link, and parent-directory metadata;
    require an allowlisted ``op whoami`` user UUID and expose only that UUID as non-secret operator evidence.
  - >-
    Replace publicly computable confirmation strings with expiring Ed25519 approvals verified by a digest-pinned
    ``ssh-keygen -Y verify`` executable against one exact, digest-pinned allowed-signers identity and fixed signature
    namespace. Sign the complete normalized non-secret contract, including repository commits, target, dependency
    paths and digests, account boundary, item identities, Agent socket, and full known-hosts identity.
  - >-
    Scope the atomic replay marker globally to Approval Authority, execution ID, and nonce, independently of action
    target or payload, so a re-signed cross-target or cross-binding request cannot reuse an already consumed approval.
    Pin the single canonical controller-only replay directory in ``approval_authority``, require the approval path to
    match it exactly, and fail closed if the directory identity changes between validation and atomic claim.
  - >-
    Restrict the SSH stdin consumer to ``root`` on the exact subject host, require one exact host-and-port Ed25519
    known-host key plus an independent SHA-256 host fingerprint, disable SSH escapes and every forwarding path, and
    safely resolve and quote the controller-owned 1Password Agent socket.
  - >-
    Read protected bytes directly into mutable buffers with ``readv``, write them through an unbuffered descriptor,
    erase those buffers on every exit path, and set the controller worker soft core-dump limit to zero before reading.
breaking_changes:
  - >-
    The three 1Password actions now require executable SHA-256 pins and an authorized user UUID allowlist. Mutating
    creation and unlock operations require ``approval_authority`` plus an armored signature in the one-time
    ``approval`` mapping instead of static ``confirmation``; SSH unlock additionally requires
    ``known_hosts_sha256``, ``destination_host_fingerprint``, and exact root/subject targeting.
    ``approval_authority.replay_directory`` is now mandatory and defines the only accepted replay domain.
